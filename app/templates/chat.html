<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1c">
<title>NEXUS Chat</title>
<link rel="stylesheet" href="/static/css/nexus.css">
</head><body>
<main class="app chat">
  <header class="top">
    <div class="logo">💬</div>
    <div><h1>Chat</h1><span class="muted">Phone ⇄ Laptop</span></div>
    <span id="state" class="pill">Loading</span>
    <button class="btn ghost sm" id="clear">Clear</button>
  </header>

  <div id="list"><div class="empty" id="empty">No messages yet.<br>Say hello 👋</div></div>
  <p class="err" id="gate" hidden>Not paired. Scan the QR code on the laptop first.</p>

  <form class="composer" id="f">
    <input class="field" id="t" maxlength="2000" placeholder="Type a message…" autocomplete="off">
    <button class="btn">Send</button>
  </form>
</main>
<nav id="tabs"></nav>

<script src="/static/js/common.js"></script>
<script>
let lastId = 0, me = null, version = null, wsUp = false, fallback = null;

function resetScreen() {
  $("list").replaceChildren($("empty"));
  $("empty").hidden = false;
  lastId = 0;
}

function show(m) {
  const box = document.createElement("div");
  box.className = "msg" + (m.side === me ? " mine" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.sender + " · " + new Date(m.created_at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const body = document.createElement("div");
  body.textContent = m.body;                       // safe against XSS
  box.append(who, body);
  $("list").appendChild(box);
}

async function poll(again = true) {
  let r;
  try { r = await api("/api/messages?after_id=" + lastId); }
  catch { setPill($("state"), "Offline", "bad"); return; }

  if (r.status === 401) {
    $("gate").hidden = false; $("f").hidden = true;
    setPill($("state"), "Not paired", "bad"); return;
  }
  $("gate").hidden = true; $("f").hidden = false;
  if (!wsUp) setPill($("state"), "Connected", "ok");
  me = r.data.me;

  if (version !== null && r.data.version !== version) {   // history was cleared elsewhere
    version = r.data.version;
    resetScreen();
    if (again) await poll(false);
    return;
  }
  version = r.data.version;

  let added = false;
  for (const m of r.data.messages) {
    if (m.id > lastId) { $("empty").hidden = true; show(m); lastId = m.id; added = true; }
  }
  if (added) $("list").scrollTop = $("list").scrollHeight;
}

// HTTP polling runs whenever the live link is down; the live link takes over when it connects
function setLive(up) {
  wsUp = up;
  if (up) { clearInterval(fallback); fallback = null; setPill($("state"), "Live", "ok"); }
  else if (!fallback) fallback = setInterval(() => poll(), 2000);
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text) return;
  $("t").value = "";
  const r = await api("/api/messages", "POST", { text });
  if (!r.ok) toast(errText(r.data), true);
  if (!wsUp) poll();
};

$("clear").onclick = async () => {
  if (!confirm("Delete ALL messages on both devices?")) return;
  const r = await api("/api/messages", "DELETE");
  if (r.ok) { version = r.data.version; resetScreen(); }
};

setLive(false);       // start over plain HTTP right away
poll();
live({
  hello:   ev => { me = ev.side; },
  open:    () => { setLive(true); poll(); },     // poll once to catch up on anything missed
  close:   () => setLive(false),
  denied:  () => { setLive(false); poll(); },
  message: ev => {
    if (ev.message.id <= lastId) return;
    $("empty").hidden = true;
    show(ev.message); lastId = ev.message.id;
    $("list").scrollTop = $("list").scrollHeight;
  },
  cleared: ev => { version = ev.version; resetScreen(); },
});
</script>
</body></html>
